.mod{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:30;padding:20px}
.mod.s{display:grid}
.mc{width:min(400px,100%);max-height:80%;overflow:auto;background:linear-gradient(#2e2e2e,#141414);border:3px solid #cfcfcf;border-radius:14px;padding:16px;color:#fff;font-family:Arial,sans-serif}

<div id="bok"></div>
<div id="wrap"><div id="stage">
  <button class="sq" id="setBtn" style="top:24px" aria-label="Settings"><svg><use href="#i-gear"/></svg></button>
  <button class="sq" id="sndBtn" style="top:80px" aria-label="Sound"><svg><use href="#i-snd"/></svg></button>
  <button class="sq" id="pwrBtn" style="top:136px" aria-label="Reset"><svg><use href="#i-pwr"/></svg></button>
  <div class="body"><div class="face" id="face">
    <div class="dome"></div><div class="cap l"></div><div class="cap r"></div>
    <div class="disp" id="credit"></div>
    <div class="rim"></div>
    <div class="pan"></div>
    <div class="lbl" style="left:46px">LINES</div><div class="lbl" style="right:46px">BET</div>
    <div class="disp" id="tbet"></div>
    <div class="btns">
      <button class="gb n" id="linesBtn">20</button>
      <button class="gb m" id="infoBtn">INFO</button>
      <button class="gb s" id="spin">SPIN</button>
      <button class="gb m" id="maxBtn">MAX<br>BET</button>
      <button class="gb n" id="betBtn">20</button>
    </div>
    <div class="base"></div>
    <div id="big"></div>
  </div></div>
  <div class="lev"></div><div id="arm"></div><div id="ball"></div>
</div></div>
<div class="mod" id="mod"><div class="mc" id="mc"></div></div>
<script>
/* ===== BACKEND ===== */
const SYMS=[{id:'melon',w:2,pay:100},{id:'grape',w:3,pay:50},{id:'berry',w:5,pay:25},{id:'orange',w:8,pay:20},{id:'lemon',w:10,pay:12},{id:'cherry',w:10,pay:8}];
const TW=SYMS.reduce((a,s)=>a+s.w,0);
const LINES=[[1,1,1],[0,0,0],[2,2,2],[0,1,2],[2,1,0],[0,1,0],[2,1,2],[1,0,1],[1,2,1],[0,0,1],[2,2,1],[1,0,0],[1,2,2],[0,1,1],[2,1,1],[1,1,0],[1,1,2],[0,2,0],[2,0,2],[1,0,2]];
const LINE_OPTS=[1,5,10,15,20],BET_OPTS=[1,2,5,10,20,50];
const E={credit:4450,lines:20,bet:20,
  load(){try{const d=JSON.parse(localStorage.getItem('cs_slot')||'null');if(d)Object.assign(this,d)}catch(e){}},
  save(){try{localStorage.setItem('cs_slot',JSON.stringify({credit:this.credit,lines:this.lines,bet:this.bet}))}catch(e){}},
  total(){return this.lines*this.bet},
  pick(){let r=Math.random()*TW;for(const s of SYMS){if((r-=s.w)<0)return s.id}return 'cherry'},
  play(){
    this.credit-=this.total();
    const grid=[0,1,2].map(()=>[this.pick(),this.pick(),this.pick()]);
    let win=0;const hits=[];
    for(let i=0;i<this.lines;i++){
      const s=LINES[i].map((r,c)=>grid[c][r]);let m=0;
      if(s[0]===s[1]&&s[1]===s[2])m=SYMS.find(x=>x.id===s[0]).pay;
      else if(s[0]==='cherry'&&s[1]==='cherry')m=3;
      if(m){win+=m*this.bet;hits.push(i)}
    }
    this.credit+=win;this.save();return{grid,win,hits};
  }
};
E.load();
/* ===== FRONTEND ===== */
const $=id=>document.getElementById(id),face=$('face'),CH=94;
const cell=id=>'<div class="cell"><svg viewBox="0 0 100 100"><use href="#s-'+id+'"/></svg></div>';
let grid=[['lemon','grape','cherry'],['lemon','cherry','lemon'],['orange','melon','berry']];
let busy=false,snd=true,ac=null;
const reels=[0,1,2].map(i=>{const r=document.createElement('div');r.className='reel';r.style.left=(124+i*146)+'px';r.innerHTML='<div class="strip"></div>';face.appendChild(r);return r.firstChild});
const LT=[4,2,8,6,1,10,7,9,3,5],RT=[14,12,18,11,16,17,20,19,13,15],tags={};
function mk(n,i,side){const t=document.createElement('div');t.className='tag '+side;t.textContent=n;t.style.top=(36+i*29)+'px';t.style[side==='l'?'left':'right']='56px';face.appendChild(t);(tags[n]=tags[n]||[]).push(t)}
LT.forEach((n,i)=>mk(n,i,'l'));RT.forEach((n,i)=>mk(n,i,'r'));
const coin=n=>'<svg class="cn" viewBox="0 0 24 24"><use href="#i-coin"/></svg>'+n;const fmt=coin;
function paint(){
  $('credit').innerHTML='<span>CREDIT</span><span>'+fmt(E.credit)+'</span>';
  $('tbet').innerHTML='<span>TOTAL BET</span><span>'+coin(E.total())+'</span>';
  $('linesBtn').textContent=E.lines;$('betBtn').textContent=E.bet;
  for(let n=1;n<=20;n++)tags[n].forEach(t=>{t.classList.toggle('off',n>E.lines);t.classList.remove('on')});
}
function draw(){reels.forEach((s,i)=>{s.style.transition='none';s.style.transform='none';s.innerHTML=grid[i].map(cell).join('')})}
const rnd=()=>SYMS[Math.floor(Math.random()*SYMS.length)].id;
function beep(f,d,t){if(!snd)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t||'square';o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
function say(t){const b=$('big');b.innerHTML=t;b.classList.add('s');setTimeout(()=>b.classList.remove('s'),1800)}
function spin(){
  if(busy)return;
  if(E.credit<E.total()){say('NO CREDIT');return}
  busy=true;['spin','maxBtn','linesBtn','betBtn'].forEach(i=>$(i).disabled=true);
  $('stage').classList.add('pulled');setTimeout(()=>$('stage').classList.remove('pulled'),350);
  const prev=grid,before=E.credit-E.total(),r=E.play(),after=E.credit;
  E.credit=before;paint();E.credit=after;
  for(let n=1;n<=20;n++)tags[n].forEach(t=>t.classList.remove('on'));
  reels.forEach((s,i)=>{
    const all=[...r.grid[i],...Array.from({length:14+i*5},rnd),...prev[i]];
    s.style.transition='none';s.innerHTML=all.map(cell).join('');
    s.style.transform='translateY('+(-(all.length-3)*CH)+'px)';void s.offsetHeight;
    const d=1.1+i*.4;s.style.transition='transform '+d+'s cubic-bezier(.15,.7,.25,1)';s.style.transform='translateY(0)';
    setTimeout(()=>beep(300+i*120,.08),d*1000-60);
  });
  beep(180,.15,'sawtooth');grid=r.grid;
  setTimeout(()=>{
    draw();paint();
    if(r.win){
      r.hits.forEach(i=>{tags[i+1].forEach(t=>t.classList.add('on'));LINES[i].forEach((row,c)=>reels[c].children[row].classList.add('win'))});
      say('WIN '+fmt(r.win));burst();beep(660,.12);setTimeout(()=>beep(880,.15),130);setTimeout(()=>beep(1100,.22),280);
    }
    busy=false;['spin','maxBtn','linesBtn','betBtn'].forEach(i=>$(i).disabled=false);
  },1100+800+150);
}
function burst(){for(let i=0;i<24;i++){const c=document.createElement('div');c.className='fc';c.innerHTML='<svg viewBox="0 0 24 24"><use href="#i-coin"/></svg>';c.style.left=(300+Math.random()*60)+'px';c.style.top='150px';c.style.setProperty('--dx',(Math.random()*480-240)+'px');c.style.setProperty('--dy',(200+Math.random()*240)+'px');c.style.setProperty('--r',(Math.random()*720-360)+'deg');c.style.animationDelay=(Math.random()*.3)+'s';face.appendChild(c);setTimeout(()=>c.remove(),1900)}}
const cyc=(a,v)=>a[(a.indexOf(v)+1)%a.length];
$('spin').onclick=spin;$('ball').onclick=spin;
$('linesBtn').onclick=()=>{E.lines=cyc(LINE_OPTS,E.lines);E.save();paint();beep(500,.05)};
$('betBtn').onclick=()=>{E.bet=cyc(BET_OPTS,E.bet);E.save();paint();beep(500,.05)};
$('maxBtn').onclick=()=>{E.lines=20;let b=BET_OPTS[0];for(const x of BET_OPTS)if(x*20<=E.credit)b=x;E.bet=b;E.save();paint();spin()};
$('sndBtn').onclick=()=>{snd=!snd;$('sndBtn').classList.toggle('off',!snd)};
$('pwrBtn').onclick=()=>{E.credit=4450;E.lines=20;E.bet=20;E.save();paint();say('RESET')};
function modal(h){$('mc').innerHTML=h+'<button id="mx">CLOSE</button>';$('mod').classList.add('s');$('mx').onclick=()=>$('mod').classList.remove('s')}
$('mod').onclick=e=>{if(e.target.id==='mod')$('mod').classList.remove('s')};
function info(){modal('<h3>Paytable (x line bet)</h3>'+SYMS.map(s=>'<div class="pr"><svg viewBox="0 0 100 100"><use href="#s-'+s.id+'"/></svg>3 in a line<b>x'+s.pay+'</b></div>').join('')+'<div class="pr"><svg viewBox="0 0 100 100"><use href="#s-cherry"/></svg>2 cherries from the left<b>x3</b></div><p style="font-size:12px;color:#ccc">Total bet = lines x bet per line. Lines are numbered on both sides of the reels.</p>')}
$('infoBtn').onclick=info;$('setBtn').onclick=info;
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();spin()}});
function fit(){
  const w = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0);
  const h = Math.max(document.documentElement.clientHeight || 0, window.innerHeight || 0);
  if (!w || !h) return;
  const s = Math.min(w / 830, h / 650);
  const stage = $('stage');
  if (stage) {
    stage.style.transform = 'scale(' + s + ')';
    stage.style.webkitTransform = 'scale(' + s + ')';
  }
}
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', fit);
document.addEventListener('DOMContentLoaded', fit);
setTimeout(fit, 50);
setTimeout(fit, 200);
setTimeout(fit, 500);
fit();
(function(){const b=$('bok');for(let i=0;i<46;i++){const e=document.createElement('i'),z=14+Math.random()*60,c=Math.random()<.4?'255,190,230':'255,255,255';e.style.cssText='width:'+z+'px;height:'+z+'px;left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;opacity:'+(.25+Math.random()*.5)+';background:radial-gradient(circle,rgba('+c+',.95),rgba('+c+',.15) 70%,transparent)';b.appendChild(e)}})();
for(let i=0;i<9;i++){const b=document.createElement('div');b.className='bulb';b.style.left=(204+i*30)+'px';b.style.top='-98px';face.appendChild(b)}
draw();paint();
// Wall-Clock Synchronized Timer (15s cycle)
const SLOT_CYCLE = 15;
setInterval(() => {
  const nowSec = Math.floor(Date.now() / 1000);
  const cyclePos = nowSec % SLOT_CYCLE;
  const rem = SLOT_CYCLE - cyclePos;

  const btn = $('spin');
  if (btn) {
    if (!busy) {
      btn.textContent = 'SPIN (' + rem + 's)';
    } else {
      btn.textContent = 'SPIN';
    }
  }

  if (cyclePos === 0 && !busy && E.credit >= E.total()) {
    spin();
  }
}, 1000);
</script>
</body>
</html>
