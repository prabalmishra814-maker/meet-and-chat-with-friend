<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="star-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#c084fc" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ffffff" flood-opacity="0.8"/>
    </filter>

    <radialGradient id="star-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#f0abfc"/>
      <stop offset="60%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </radialGradient>
  </defs>

  <g filter="url(#star-glow)">
    <!-- 4-Pointed Glowing Star -->
    <path d="M 100 10
             C 105 70, 130 95, 190 100
             C 130 105, 105 130, 100 190
             C 95 130, 70 105, 10 100
             C 70 95, 95 70, 100 10 Z"
          fill="url(#star-grad)"/>

    <!-- Diagonal Secondary Rays -->
    <path d="M 100 50
             C 103 80, 120 97, 150 100
             C 120 103, 103 120, 100 150
             C 97 120, 80 103, 50 100
             C 80 97, 97 80, 100 50 Z"
          fill="#ffffff" opacity="0.85"/>

    <!-- Bright Center Lens Flare Core -->
    <circle cx="100" cy="100" r="14" fill="#ffffff"/>
  </g>
</svg>