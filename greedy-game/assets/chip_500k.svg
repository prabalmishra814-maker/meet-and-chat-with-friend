      <rect x="46" y="5" width="8" height="10" rx="2"/>
      <rect x="46" y="85" width="8" height="10" rx="2"/>
      <rect x="5" y="46" width="10" height="8" rx="2"/>
      <rect x="85" y="46" width="10" height="8" rx="2"/>
      <rect x="17" y="17" width="8" height="8" rx="2" transform="rotate(45 21 21)"/>
      <rect x="75" y="17" width="8" height="8" rx="2" transform="rotate(-45 79 21)"/>
      <rect x="17" y="75" width="8" height="8" rx="2" transform="rotate(-45 21 79)"/>
      <rect x="75" y="75" width="8" height="8" rx="2" transform="rotate(45 79 79)"/>
    </g>

    <circle cx="50" cy="50" r="32" fill="none" stroke="url(#goldRim)" stroke-width="3.5"/>
    <circle cx="50" cy="50" r="26" fill="url(#chipCenter)"/>

    <text x="50" y="57" font-family="'Impact', 'Arial Black', sans-serif" font-size="16" font-weight="900" text-anchor="middle" fill="#023e8a">500K</text>
