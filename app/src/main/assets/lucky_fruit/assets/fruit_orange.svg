<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <!-- Orange Radial Gradient -->
    <radialGradient id="orangeGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fff066"/>
      <stop offset="20%" stop-color="#ffaa00"/>
      <stop offset="65%" stop-color="#e65c00"/>
      <stop offset="90%" stop-color="#b33600"/>
      <stop offset="100%" stop-color="#661a00"/>
    </radialGradient>

    <!-- Glossy Highlight Gradient -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80e633"/>
      <stop offset="50%" stop-color="#3b9909"/>
      <stop offset="100%" stop-color="#194d00"/>
    </linearGradient>

    <!-- Stem Gradient -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#80531c"/>
      <stop offset="100%" stop-color="#3d2200"/>
    </linearGradient>
  </defs>

  <g filter="url(#shadow)">
    <!-- Main Orange Body -->
    <circle cx="60" cy="64" r="46" fill="url(#orangeGrad)"/>

    <!-- Subtle Pore Texture Pattern -->
    <circle cx="42" cy="55" r="1" fill="#fff" opacity="0.3"/>
    <circle cx="50" cy="48" r="1.2" fill="#fff" opacity="0.35"/>
    <circle cx="65" cy="52" r="1.2" fill="#fff" opacity="0.3"/>
    <circle cx="38" cy="68" r="1.5" fill="#e65c00" opacity="0.4"/>
    <circle cx="72" cy="70" r="1.5" fill="#e65c00" opacity="0.4"/>
    <circle cx="58" cy="82" r="1.8" fill="#b33600" opacity="0.5"/>

    <!-- Stem Indentation -->
    <ellipse cx="60" cy="22" rx="6" ry="3" fill="#804000" opacity="0.6"/>

    <!-- Stem -->
    <path d="M 60 22 C 59 14, 62 10, 65 6 C 67 8, 66 14, 61 22 Z" fill="url(#stemGrad)"/>

    <!-- Realistic Green Leaf -->
    <path d="M 60 20 C 75 8, 100 12, 104 28 C 88 34, 68 30, 60 20 Z" fill="url(#leafGrad)"/>
    <!-- Leaf Vein -->
    <path d="M 60 20 C 75 22, 92 24, 104 28" stroke="#a3ff47" stroke-width="1.2" fill="none" opacity="0.7"/>

    <!-- Primary Specular Gloss Highlight -->
    <path d="M 32 36 A 36 36 0 0 1 78 30 C 65 34, 42 42, 32 36 Z" fill="url(#glossGrad)"/>
    <ellipse cx="44" cy="40" rx="12" ry="6" transform="rotate(-25 44 40)" fill="#ffffff" opacity="0.45"/>
  </g>
</svg>