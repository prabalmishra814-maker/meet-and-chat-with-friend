<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Drop Shadow and Red Ambient Glow -->
    <filter id="seven-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#ef4444" flood-opacity="0.6"/>
    </filter>

    <!-- Glossy Red 3D Gradient -->
    <linearGradient id="red-body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8585"/>
      <stop offset="18%" stop-color="#ef4444"/>
      <stop offset="55%" stop-color="#dc2626"/>
      <stop offset="85%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>

    <!-- Metallic Gold Outer Frame Gradient -->
    <linearGradient id="gold-frame-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Inner Bevel Highlight -->
    <linearGradient id="gold-highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g filter="url(#seven-shadow)">
    <!-- 1. Outer Gold Bevel Frame (Thick outer contour of classic 7) -->
    <path d="M 38 28
             L 162 28
             C 168 28, 172 32, 170 38
             L 115 168
             C 112 174, 102 176, 96 172
             L 64 150
             C 58 146, 58 138, 64 135
             L 76 126
             C 80 123, 86 125, 88 130
             L 100 152
             L 142 58
             L 38 58
             C 30 58, 30 28, 38 28 Z"
          fill="url(#gold-frame-grad)" />

    <!-- 2. Clean Classic Outer 7 Gold Rim -->
    <path d="M 36 26
             L 164 26
             C 171 26, 174 32, 171 39
             L 116 172
             C 113 178, 104 180, 97 175
             L 70 156
             L 126 56
             L 36 56 Z"
          fill="url(#gold-frame-grad)"/>

    <!-- 3. Inner Red 3D Body (Classic clean 7 shape) -->
    <path d="M 42 32
             L 158 32
             L 110 166
             L 78 144
             L 128 50
             L 42 50 Z"
          fill="url(#red-body-grad)"/>

    <!-- 4. Inner Shadow Bevel Edge for Depth -->
    <path d="M 42 50 L 128 50 L 110 166 L 102 166 L 120 54 L 42 54 Z" fill="#2d0404" opacity="0.6"/>

    <!-- 5. Glossy Top Reflection Highlight -->
    <path d="M 42 32 L 158 32 L 150 44 L 42 44 Z" fill="url(#gold-highlight)"/>
    <path d="M 128 50 L 158 32 L 148 54 Z" fill="#ffffff" opacity="0.45"/>

    <!-- 6. Sparkle Flare Accent on Top Right Corner -->
    <path d="M 154 28 L 157 36 L 165 39 L 157 42 L 154 50 L 151 42 L 143 39 L 151 36 Z" fill="#ffffff" opacity="0.95"/>
    <circle cx="154" cy="39" r="3" fill="#ffffff"/>
  </g>
</svg>