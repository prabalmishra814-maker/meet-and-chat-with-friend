<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <radialGradient id="cherryGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ff9999"/>
      <stop offset="20%" stop-color="#ff0033"/>
      <stop offset="65%" stop-color="#cc0029"/>
      <stop offset="90%" stop-color="#80001a"/>
      <stop offset="100%" stop-color="#33000a"/>
    </radialGradient>

    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a6e600"/>
      <stop offset="50%" stop-color="#4d9900"/>
      <stop offset="100%" stop-color="#264d00"/>
    </linearGradient>

    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#73e600"/>
      <stop offset="100%" stop-color="#1a4d00"/>
    </linearGradient>
  </defs>

  <g filter="url(#shadow)">
    <!-- Curved Stems -->
    <path d="M 40 70 C 42 40, 58 20, 68 12" stroke="url(#stemGrad)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M 80 65 C 76 42, 68 24, 68 12" stroke="url(#stemGrad)" stroke-width="3.5" stroke-linecap="round" fill="none"/>

    <!-- Stem Join Leaf -->
    <path d="M 68 12 C 85 4, 98 12, 92 24 C 78 22, 70 18, 68 12 Z" fill="url(#leafGrad)"/>

    <!-- Left Cherry -->
    <g>
      <circle cx="40" cy="74" r="22" fill="url(#cherryGrad)"/>
      <ellipse cx="32" cy="65" rx="7" ry="3.5" transform="rotate(-25 32 65)" fill="#ffffff" opacity="0.75"/>
      <circle cx="46" cy="80" r="3" fill="#ffffff" opacity="0.25"/>
    </g>

    <!-- Right Cherry -->
    <g>
      <circle cx="80" cy="70" r="20" fill="url(#cherryGrad)"/>
      <ellipse cx="73" cy="62" rx="6" ry="3" transform="rotate(-25 73 62)" fill="#ffffff" opacity="0.75"/>
      <circle cx="85" cy="75" r="2.5" fill="#ffffff" opacity="0.25"/>
    </g>
  </g>
</svg>