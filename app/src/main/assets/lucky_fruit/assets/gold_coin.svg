<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>

    <linearGradient id="goldRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#ffee77"/>
      <stop offset="45%" stop-color="#f5b000"/>
      <stop offset="75%" stop-color="#a66a00"/>
      <stop offset="90%" stop-color="#ffea88"/>
      <stop offset="100%" stop-color="#593400"/>
    </linearGradient>

    <radialGradient id="goldFaceGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff9bb"/>
      <stop offset="30%" stop-color="#ffcc00"/>
      <stop offset="70%" stop-color="#e68a00"/>
      <stop offset="100%" stop-color="#804d00"/>
    </radialGradient>

    <linearGradient id="glareGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g filter="url(#shadow)">
    <!-- Outer Beveled Rim -->
    <circle cx="50" cy="50" r="46" fill="url(#goldRimGrad)"/>

    <!-- Inner Coin Face Ring -->
    <circle cx="50" cy="50" r="38" fill="#804d00"/>
    <circle cx="50" cy="50" r="36" fill="url(#goldFaceGrad)"/>

    <!-- Beveled Stamped Inner Border -->
    <circle cx="50" cy="50" r="32" stroke="#ffee77" stroke-width="2" fill="none" opacity="0.8"/>

    <!-- Center Star Emblem -->
    <polygon points="50,26 56,38 69,38 58,46 62,59 50,51 38,59 42,46 31,38 44,38" fill="url(#goldRimGrad)"/>

    <!-- Glossy Reflection Sheen -->
    <path d="M 18 36 A 38 38 0 0 1 82 36 C 65 42, 35 42, 18 36 Z" fill="url(#glareGrad)"/>
  </g>
</svg>