<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="carrGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff9e00"/>
      <stop offset="50%" stop-color="#ff6d00"/>
      <stop offset="85%" stop-color="#e35100"/>
      <stop offset="100%" stop-color="#9e2a0b"/>
    </radialGradient>
    <linearGradient id="topGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#70e000"/>
      <stop offset="100%" stop-color="#007200"/>
    </linearGradient>
    <filter id="carrDrop">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Shadow -->
  <ellipse cx="50" cy="85" rx="28" ry="8" fill="#000" opacity="0.25"/>
  <g transform="rotate(-30 50 50)" filter="url(#carrDrop)">
    <!-- Leafy Greens Top -->
    <path d="M 45 22 C 30 10 25 0 35 5 C 40 10 44 18 45 22 Z" fill="url(#topGreen)"/>
    <path d="M 50 20 C 50 5 45 -5 52 -2 C 55 5 53 15 50 20 Z" fill="url(#topGreen)"/>
    <path d="M 55 22 C 70 10 75 0 65 5 C 60 10 56 18 55 22 Z" fill="url(#topGreen)"/>
    <!-- Carrot Root -->
    <path d="M 38 24 Q 50 20 62 24 Q 60 55 50 82 Q 40 55 38 24 Z" fill="url(#carrGrad)"/>
    <!-- Horizontal Ridges -->
    <path d="M 42 35 Q 50 32 58 35 M 43 46 Q 50 44 56 46 M 45 58 Q 50 56 54 58" stroke="#f77f00" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Specular Highlight -->
    <ellipse cx="44" cy="30" rx="4" ry="8" transform="rotate(-15 44 30)" fill="#ffffff" opacity="0.5"/>
  </g>
</svg>