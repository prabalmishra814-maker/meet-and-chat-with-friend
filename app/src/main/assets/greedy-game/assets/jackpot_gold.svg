<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 130" width="100%" height="100%">
  <defs>
    <linearGradient id="goldText3D" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#fff7a1"/>
      <stop offset="45%" stop-color="#fdb813"/>
      <stop offset="75%" stop-color="#d48806"/>
      <stop offset="100%" stop-color="#804a00"/>
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff5ad"/>
      <stop offset="40%" stop-color="#ffb703"/>
      <stop offset="80%" stop-color="#d48806"/>
      <stop offset="100%" stop-color="#7a4200"/>
    </linearGradient>
    <radialGradient id="coinGrad3D" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffcc"/>
      <stop offset="40%" stop-color="#ffcc00"/>
      <stop offset="80%" stop-color="#cc8800"/>
      <stop offset="100%" stop-color="#663300"/>
    </radialGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComponentTransfer in="blur" result="brightBlur">
        <feFuncA type="linear" slope="1.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="brightBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dropShadow">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>
  <g filter="url(#dropShadow)">
    <path d="M 40 70 Q 210 42 380 70 Q 395 95 370 102 Q 210 78 50 102 Q 25 95 40 70 Z" fill="url(#goldRibbon)" stroke="#ffea00" stroke-width="1.5"/>
  </g>
  <g id="left-coins" transform="translate(62, 60)" filter="url(#dropShadow)">
    <ellipse cx="0" cy="18" rx="26" ry="11" fill="url(#coinGrad3D)" stroke="#522b00" stroke-width="1.5"/>
    <ellipse cx="-4" cy="10" rx="26" ry="11" fill="url(#coinGrad3D)" stroke="#522b00" stroke-width="1.5"/>
    <ellipse cx="2" cy="2" rx="26" ry="11" fill="url(#coinGrad3D)" stroke="#522b00" stroke-width="1.5"/>
    <ellipse cx="2" cy="2" rx="20" ry="8" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.7"/>
    <ellipse cx="-2" cy="-6" rx="26" ry="11" fill="url(#coinGrad3D)" stroke="#522b00" stroke-width="1.5"/>
    <ellipse cx="-2" cy="-6" rx="20" ry="8" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.8"/>
  </g>
  <g id="right-coins" transform="translate(358, 60)" filter="url(#dropShadow)">
    <ellipse cx="0" cy="18" rx="26" ry="11" fill="url(#coinGrad3D)" stroke="#522b00" stroke-width="1.5"/>
    <ellipse cx="4" cy="10" rx="26" ry="11" fill="url(#coinGrad3D)" stroke="#522b00" stroke-width="1.5"/>
    <ellipse cx="-2" cy="2" rx="26" ry="11" fill="url(#coinGrad3D)" stroke="#522b00" stroke-width="1.5"/>
    <ellipse cx="-2" cy="2" rx="20" ry="8" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.7"/>
    <ellipse cx="2" cy="-6" rx="26" ry="11" fill="url(#coinGrad3D)" stroke="#522b00" stroke-width="1.5"/>
    <ellipse cx="2" cy="-6" rx="20" ry="8" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.8"/>
  </g>
  <g filter="url(#dropShadow)">
    <text x="210" y="56" font-family="'Impact', 'Arial Black', sans-serif" font-size="48" font-weight="900" text-anchor="middle" letter-spacing="4" fill="#260c00" stroke="#000" stroke-width="10" stroke-linejoin="round">JACKPOT</text>
    <text x="210" y="53" font-family="'Impact', 'Arial Black', sans-serif" font-size="48" font-weight="900" text-anchor="middle" letter-spacing="4" fill="#663300" stroke="#3d1b00" stroke-width="6" stroke-linejoin="round">JACKPOT</text>
    <text x="210" y="50" font-family="'Impact', 'Arial Black', sans-serif" font-size="48" font-weight="900" text-anchor="middle" letter-spacing="4" fill="url(#goldText3D)" filter="url(#goldGlow)">JACKPOT</text>
  </g>
  <path d="M 98 22 Q 98 28 104 28 Q 98 28 98 34 Q 98 28 92 28 Q 98 28 98 22 Z" fill="#ffffff" filter="url(#goldGlow)"/>
  <path d="M 322 18 Q 322 24 328 24 Q 322 24 322 30 Q 322 24 316 24 Q 322 24 322 18 Z" fill="#ffffff" filter="url(#goldGlow)"/>
  <path d="M 210 10 Q 210 14 214 14 Q 210 14 210 18 Q 210 14 206 14 Q 210 14 210 10 Z" fill="#fff5ad"/>
</svg>