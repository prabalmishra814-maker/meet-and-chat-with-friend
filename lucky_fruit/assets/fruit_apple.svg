<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <radialGradient id="appleGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffff99"/>
      <stop offset="25%" stop-color="#99e600"/>
      <stop offset="65%" stop-color="#59b300"/>
      <stop offset="90%" stop-color="#336600"/>
      <stop offset="100%" stop-color="#1a3300"/>
    </radialGradient>

    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#80531c"/>
      <stop offset="100%" stop-color="#3d2200"/>
    </linearGradient>

    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#73e600"/>
      <stop offset="100%" stop-color="#1a4d00"/>
    </linearGradient>
  </defs>

  <g filter="url(#shadow)">
    <!-- Stem Indentation -->
    <ellipse cx="60" cy="28" rx="8" ry="4" fill="#264d00" opacity="0.6"/>

    <!-- Stem -->
    <path d="M 60 28 C 58 18, 64 12, 68 8 C 70 10, 66 18, 61 28 Z" fill="url(#stemGrad)"/>

    <!-- Leaf -->
    <path d="M 62 24 C 78 12, 96 18, 92 32 C 78 34, 66 28, 62 24 Z" fill="url(#leafGrad)"/>
    <path d="M 62 24 C 75 24, 88 26, 92 32" stroke="#a6ff4d" stroke-width="1" fill="none"/>

    <!-- Apple Body Shape -->
    <path d="M 60 28 C 42 22, 20 38, 20 62 C 20 86, 40 102, 55 102 C 58 102, 60 99, 60 99 C 60 99, 62 102, 65 102 C 80 102, 100 86, 100 62 C 100 38, 78 22, 60 28 Z" fill="url(#appleGrad)"/>

    <!-- Primary Specular Gloss Highlight -->
    <path d="M 32 38 C 24 50, 24 70, 32 80 C 28 68, 28 48, 36 40 Z" fill="url(#glossGrad)"/>
    <ellipse cx="44" cy="42" rx="10" ry="5" transform="rotate(-25 44 42)" fill="#ffffff" opacity="0.5"/>
  </g>
</svg>