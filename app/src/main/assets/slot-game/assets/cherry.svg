<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="cherry-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#dc2626" flood-opacity="0.5"/>
    </filter>

    <radialGradient id="cherry-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="20%" stop-color="#ef4444"/>
      <stop offset="65%" stop-color="#b91c1c"/>
      <stop offset="90%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </radialGradient>

    <linearGradient id="cherry-stem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
  </defs>

  <g filter="url(#cherry-shadow)">
    <!-- Stems -->
    <path d="M 125 30 C 100 40, 75 80, 68 115" fill="none" stroke="url(#cherry-stem)" stroke-width="6" stroke-linecap="round"/>
    <path d="M 125 30 C 120 60, 130 85, 135 115" fill="none" stroke="url(#cherry-stem)" stroke-width="6" stroke-linecap="round"/>

    <!-- Stem Join Leaf -->
    <path d="M 125 30 C 145 18, 165 25, 155 45 C 140 42, 130 35, 125 30 Z" fill="url(#cherry-stem)"/>

    <!-- Left Cherry -->
    <circle cx="65" cy="135" r="32" fill="url(#cherry-grad)"/>
    <!-- Right Cherry -->
    <circle cx="138" cy="135" r="32" fill="url(#cherry-grad)"/>

    <!-- Indents -->
    <ellipse cx="68" cy="108" rx="8" ry="3" fill="#450a0a" opacity="0.8"/>
    <ellipse cx="135" cy="108" rx="8" ry="3" fill="#450a0a" opacity="0.8"/>

    <!-- Specular Gloss Highlights -->
    <ellipse cx="55" cy="122" rx="10" ry="6" fill="#ffffff" opacity="0.85" transform="rotate(-30 55 122)"/>
    <ellipse cx="128" cy="122" rx="10" ry="6" fill="#ffffff" opacity="0.85" transform="rotate(-30 128 122)"/>
  </g>
</svg>