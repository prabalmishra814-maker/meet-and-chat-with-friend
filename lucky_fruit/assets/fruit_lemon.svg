<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <radialGradient id="lemonGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#ffff4d"/>
      <stop offset="65%" stop-color="#f2c200"/>
      <stop offset="90%" stop-color="#b38f00"/>
      <stop offset="100%" stop-color="#665200"/>
    </radialGradient>

    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#73e600"/>
      <stop offset="60%" stop-color="#339900"/>
      <stop offset="100%" stop-color="#1a4d00"/>
    </linearGradient>
  </defs>

  <g filter="url(#shadow)">
    <!-- Oval Ellipse Lemon Body Rotated -->
    <g transform="rotate(-25 60 62)">
      <path d="M 18 62 C 18 36, 38 22, 60 22 C 82 22, 102 36, 102 62 C 102 88, 82 102, 60 102 C 38 102, 18 88, 18 62 Z" fill="url(#lemonGrad)"/>

      <!-- Lemon Nipple Ends -->
      <path d="M 18 62 C 10 62, 8 58, 12 55 C 16 52, 18 56, 18 62 Z" fill="#e6b800"/>
      <path d="M 102 62 C 110 62, 112 66, 108 69 C 104 72, 102 68, 102 62 Z" fill="#997a00"/>

      <!-- Primary Highlight -->
      <ellipse cx="45" cy="42" rx="20" ry="10" transform="rotate(-15 45 42)" fill="url(#glossGrad)"/>
      <ellipse cx="40" cy="38" rx="10" ry="4" transform="rotate(-15 40 38)" fill="#ffffff" opacity="0.6"/>
    </g>

    <!-- Leaf Stem -->
    <path d="M 32 30 C 18 18, 38 10, 48 18 C 42 28, 36 32, 32 30 Z" fill="url(#leafGrad)"/>
    <path d="M 32 30 C 26 24, 38 16, 48 18" stroke="#a6ff4d" stroke-width="1" fill="none"/>
  </g>
</svg>