<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="diamond-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#38bdf8" flood-opacity="0.6"/>
    </filter>

    <linearGradient id="facet-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="facet-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <linearGradient id="facet-center" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <linearGradient id="facet-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>

    <linearGradient id="facet-bottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>

  <g filter="url(#diamond-glow)">
    <!-- Crown Top Facets -->
    <polygon points="60,60 100,25 140,60" fill="url(#facet-top)"/>
    <polygon points="25,60 60,60 100,25" fill="#a5f3fc"/>
    <polygon points="140,60 175,60 100,25" fill="#c084fc"/>

    <!-- Upper Side Facets -->
    <polygon points="25,60 60,60 45,95" fill="url(#facet-left)"/>
    <polygon points="60,60 140,60 100,95" fill="url(#facet-center)"/>
    <polygon points="140,60 175,60 155,95" fill="url(#facet-right)"/>

    <!-- Bottom Pavilion Facets -->
    <polygon points="25,60 45,95 100,175" fill="#0369a1"/>
    <polygon points="45,95 100,95 100,175" fill="url(#facet-bottom)"/>
    <polygon points="100,95 155,95 100,175" fill="#581c87"/>
    <polygon points="155,95 175,60 100,175" fill="#3b0764"/>

    <!-- Facet Edge Highlights -->
    <polyline points="25,60 100,25 175,60 100,175 25,60" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
    <polyline points="60,60 100,95 140,60" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
    <line x1="100" y1="25" x2="100" y2="175" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>

    <!-- Sparkle Lens Flare -->
    <path d="M 100 15 L 103 23 L 111 25 L 103 27 L 100 35 L 97 27 L 89 25 L 97 23 Z" fill="#ffffff"/>
  </g>
</svg>