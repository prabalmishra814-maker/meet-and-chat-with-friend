<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="cornGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="50%" stop-color="#ffc300"/>
      <stop offset="85%" stop-color="#ff9f1c"/>
      <stop offset="100%" stop-color="#e76f51"/>
    </radialGradient>
    <linearGradient id="huskGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9ef01a"/>
      <stop offset="50%" stop-color="#70e000"/>
      <stop offset="100%" stop-color="#38b000"/>
    </linearGradient>
    <filter id="cornDrop">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Shadow -->
  <ellipse cx="50" cy="85" rx="30" ry="8" fill="#000" opacity="0.25"/>
  <!-- Corn Cob Oval -->
  <g transform="rotate(-25 50 50)" filter="url(#cornDrop)">
    <!-- Husks behind -->
    <path d="M 25 70 C 15 40 30 20 40 25 C 38 45 35 65 25 70 Z" fill="url(#huskGrad)"/>
    <path d="M 70 70 C 80 40 65 20 55 25 C 58 45 60 65 70 70 Z" fill="url(#huskGrad)"/>
    <!-- Cob -->
    <ellipse cx="48" cy="45" rx="18" ry="32" fill="url(#cornGrad)"/>
    <!-- Kernels Pattern -->
    <g fill="#ffea00" stroke="#d48806" stroke-width="0.8" opacity="0.9">
      <circle cx="42" cy="25" r="3"/><circle cx="48" cy="25" r="3"/><circle cx="54" cy="25" r="3"/>
      <circle cx="39" cy="33" r="3.2"/><circle cx="45" cy="33" r="3.2"/><circle cx="51" cy="33" r="3.2"/><circle cx="57" cy="33" r="3.2"/>
      <circle cx="38" cy="42" r="3.2"/><circle cx="45" cy="42" r="3.2"/><circle cx="51" cy="42" r="3.2"/><circle cx="58" cy="42" r="3.2"/>
      <circle cx="39" cy="51" r="3.2"/><circle cx="45" cy="51" r="3.2"/><circle cx="51" cy="51" r="3.2"/><circle cx="57" cy="51" r="3.2"/>
      <circle cx="42" cy="60" r="3"/><circle cx="48" cy="60" r="3"/><circle cx="54" cy="60" r="3"/>
    </g>
    <!-- Foreground Husks -->
    <path d="M 30 75 C 30 55 40 45 42 62 C 38 72 32 76 30 75 Z" fill="url(#huskGrad)"/>
    <path d="M 66 75 C 66 55 56 45 54 62 C 58 72 64 76 66 75 Z" fill="url(#huskGrad)"/>
  </g>
</svg>