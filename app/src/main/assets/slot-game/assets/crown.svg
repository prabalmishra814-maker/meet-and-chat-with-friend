<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="crown-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.5"/>
    </filter>

    <linearGradient id="crown-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <radialGradient id="ruby-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="40%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>

    <radialGradient id="gem-cyan" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="40%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#164e63"/>
    </radialGradient>
  </defs>

  <g filter="url(#crown-shadow)">
    <!-- Main Crown Body -->
    <path d="M 30 145
             L 20 60
             L 60 95
             L 100 40
             L 140 95
             L 180 60
             L 170 145 Z"
          fill="url(#crown-gold)" stroke="#78350f" stroke-width="2"/>

    <!-- Bottom Velvet Rim Base -->
    <rect x="25" y="145" width="150" height="20" rx="6" fill="#581c87" stroke="url(#crown-gold)" stroke-width="3"/>

    <!-- Jewels on Peaks -->
    <circle cx="20" cy="55" r="9" fill="url(#ruby-grad)"/>
    <circle cx="100" cy="35" r="12" fill="url(#gem-cyan)"/>
    <circle cx="180" cy="55" r="9" fill="url(#ruby-grad)"/>

    <!-- Jewels on Base Rim -->
    <circle cx="50" cy="155" r="6" fill="url(#gem-cyan)"/>
    <circle cx="100" cy="155" r="8" fill="url(#ruby-grad)"/>
    <circle cx="150" cy="155" r="6" fill="url(#gem-cyan)"/>

    <!-- Crown Inner Shading and Highlights -->
    <path d="M 100 40 L 140 95 L 100 145 Z" fill="#78350f" opacity="0.3"/>
    <path d="M 20 60 L 60 95 L 30 145 Z" fill="#ffffff" opacity="0.2"/>
    <path d="M 100 40 L 60 95 L 100 145 Z" fill="#ffffff" opacity="0.25"/>

    <!-- Sparkles -->
    <path d="M 100 20 L 102 28 L 110 30 L 102 32 L 100 40 L 98 32 L 90 30 L 98 28 Z" fill="#ffffff"/>
  </g>
</svg>