<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f39c12"/>
      <stop offset="50%" stop-color="#d35400"/>
      <stop offset="100%" stop-color="#6e2c00"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fad7a0"/>
    </linearGradient>
  </defs>
  <g filter="url(#shadow)">
    <circle cx="40" cy="40" r="36" fill="url(#rimGrad)"/>
    <rect x="36" y="4" width="8" height="8" fill="#d35400" rx="1"/>
    <rect x="36" y="68" width="8" height="8" fill="#d35400" rx="1"/>
    <rect x="4" y="36" width="8" height="8" fill="#d35400" rx="1"/>
    <rect x="68" y="36" width="8" height="8" fill="#d35400" rx="1"/>
    <circle cx="40" cy="40" r="28" fill="url(#chipGrad)" stroke="#ffffff" stroke-width="2"/>
    <circle cx="40" cy="40" r="20" fill="none" stroke="#f8c471" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="40" y="45" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="900" fill="#ffffff" text-anchor="middle">500K</text>
  </g>
</svg>