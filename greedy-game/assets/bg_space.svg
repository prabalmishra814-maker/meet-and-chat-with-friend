<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 900" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4a157e"/>
      <stop offset="40%" stop-color="#2a084c"/>
      <stop offset="85%" stop-color="#120224"/>
      <stop offset="100%" stop-color="#0a0014"/>
    </radialGradient>
    <linearGradient id="glowTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9d4edd" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2a084c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cityGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3c096c" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10002b" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="blurGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="900" fill="url(#bgGrad)"/>
  <rect width="500" height="400" fill="url(#glowTop)"/>

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="40" cy="80" r="1.5"/>
    <circle cx="120" cy="40" r="1.2"/>
    <circle cx="200" cy="110" r="2"/>
    <circle cx="280" cy="60" r="1"/>
    <circle cx="360" cy="90" r="2.2"/>
    <circle cx="440" cy="50" r="1.5"/>
    <circle cx="80" cy="200" r="1"/>
    <circle cx="420" cy="220" r="1.8"/>
    <circle cx="60" cy="350" r="2"/>
    <circle cx="450" cy="380" r="1.2"/>
    <circle cx="30" cy="500" r="1.5"/>
    <circle cx="470" cy="530" r="2.5"/>
  </g>

  <!-- Sparkling 4-point stars -->
  <path d="M 100 150 Q 100 160 110 160 Q 100 160 100 170 Q 100 160 90 160 Q 100 160 100 150 Z" fill="#ffd700" opacity="0.9"/>
  <path d="M 390 120 Q 390 128 398 128 Q 390 128 390 136 Q 390 128 382 128 Q 390 128 390 120 Z" fill="#ffffff" opacity="0.95"/>
  <path d="M 430 300 Q 430 306 436 306 Q 430 306 430 312 Q 430 306 424 306 Q 430 306 430 300 Z" fill="#ff77e9" opacity="0.85"/>
  <path d="M 70 420 Q 70 426 76 426 Q 70 426 70 432 Q 70 426 64 426 Q 70 426 70 420 Z" fill="#70d6ff" opacity="0.85"/>

  <!-- Subtle Horizon City Silhouette -->
  <path d="M 0 620 L 30 620 L 30 600 L 50 600 L 50 630 L 90 630 L 90 580 L 120 580 L 120 630 L 160 630 L 160 610 L 190 610 L 190 635 L 240 635 L 240 570 L 270 570 L 270 635 L 320 635 L 320 600 L 350 600 L 350 630 L 400 630 L 400 590 L 430 590 L 430 630 L 500 630 L 500 900 L 0 900 Z" fill="url(#cityGrad)"/>

  <!-- City Lights -->
  <g fill="#ffea00" opacity="0.4">
    <rect x="95" y="590" width="3" height="4"/>
    <rect x="105" y="600" width="3" height="4"/>
    <rect x="248" y="580" width="4" height="5"/>
    <rect x="258" y="595" width="4" height="5"/>
    <rect x="408" y="600" width="3" height="4"/>
  </g>
</svg>