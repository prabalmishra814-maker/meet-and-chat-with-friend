<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="btn-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="btn-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
  </defs>

  <!-- Circular Button Base -->
  <circle cx="50" cy="50" r="45" fill="url(#btn-bg)" stroke="url(#btn-border)" stroke-width="4"/>
  <circle cx="50" cy="50" r="41" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3"/>

  <!-- Clock / History Icon -->
  <path d="M 50 25 A 25 25 0 1 1 27 60" fill="none" stroke="#e9d5ff" stroke-width="5" stroke-linecap="round"/>
  <!-- Arrow Head -->
  <path d="M 22 46 L 27 60 L 41 55" fill="none" stroke="#e9d5ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Hands -->
  <polyline points="50,34 50,50 62,50" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="50" cy="50" r="4" fill="#38bdf8"/>
</svg>