<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <radialGradient id="strawGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ff9999"/>
      <stop offset="25%" stop-color="#ff0022"/>
      <stop offset="70%" stop-color="#cc001b"/>
      <stop offset="90%" stop-color="#800011"/>
      <stop offset="100%" stop-color="#4d000a"/>
    </radialGradient>

    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80e633"/>
      <stop offset="50%" stop-color="#399909"/>
      <stop offset="100%" stop-color="#184d00"/>
    </linearGradient>

    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g filter="url(#shadow)">
    <!-- Heart / Teardrop Strawberry Body -->
    <path d="M 60 28 C 85 24, 102 42, 92 70 C 82 92, 66 104, 60 106 C 54 104, 38 92, 28 70 C 18 42, 35 24, 60 28 Z" fill="url(#strawGrad)"/>

    <!-- Seed Dimples Pattern -->
    <g fill="#ffe680" opacity="0.95">
      <ellipse cx="42" cy="45" rx="1.5" ry="2.5" transform="rotate(-10 42 45)"/>
      <ellipse cx="60" cy="42" rx="1.5" ry="2.5"/>
      <ellipse cx="78" cy="45" rx="1.5" ry="2.5" transform="rotate(10 78 45)"/>
      <ellipse cx="34" cy="62" rx="1.5" ry="2.5" transform="rotate(-15 34 62)"/>
      <ellipse cx="50" cy="60" rx="1.5" ry="2.5"/>
      <ellipse cx="70" cy="60" rx="1.5" ry="2.5"/>
      <ellipse cx="86" cy="62" rx="1.5" ry="2.5" transform="rotate(15 86 62)"/>
      <ellipse cx="42" cy="78" rx="1.5" ry="2.5" transform="rotate(-10 42 78)"/>
      <ellipse cx="60" cy="76" rx="1.5" ry="2.5"/>
      <ellipse cx="78" cy="78" rx="1.5" ry="2.5" transform="rotate(10 78 78)"/>
      <ellipse cx="52" cy="92" rx="1.2" ry="2"/>
      <ellipse cx="68" cy="92" rx="1.2" ry="2"/>
      <ellipse cx="60" cy="100" rx="1" ry="1.5"/>
    </g>

    <!-- Green Leaf Crown (Calyx) -->
    <path d="M 60 28 L 52 14 C 56 22, 58 26, 60 28 Z" fill="url(#leafGrad)"/>
    <path d="M 60 28 C 45 15, 28 22, 38 32 C 48 30, 55 28, 60 28 Z" fill="url(#leafGrad)"/>
    <path d="M 60 28 C 75 15, 92 22, 82 32 C 72 30, 65 28, 60 28 Z" fill="url(#leafGrad)"/>
    <path d="M 60 28 C 50 35, 42 42, 45 36 Z" fill="url(#leafGrad)"/>
    <path d="M 60 28 C 70 35, 78 42, 75 36 Z" fill="url(#leafGrad)"/>

    <!-- Stem -->
    <path d="M 60 20 C 58 12, 62 8, 65 4 C 67 6, 64 12, 61 20 Z" fill="#336600"/>

    <!-- Primary Specular Gloss Highlight -->
    <path d="M 36 38 C 28 50, 28 68, 36 78 C 30 68, 30 50, 42 40 Z" fill="url(#glossGrad)"/>
    <ellipse cx="45" cy="42" rx="8" ry="4" transform="rotate(-25 45 42)" fill="#ffffff" opacity="0.5"/>
  </g>
</svg>