<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <radialGradient id="grapeGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#e699ff"/>
      <stop offset="25%" stop-color="#ac00e6"/>
      <stop offset="70%" stop-color="#590080"/>
      <stop offset="100%" stop-color="#260033"/>
    </radialGradient>

    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80e633"/>
      <stop offset="50%" stop-color="#399909"/>
      <stop offset="100%" stop-color="#184d00"/>
    </linearGradient>

    <linearGradient id="vineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a67c52"/>
      <stop offset="100%" stop-color="#4d3319"/>
    </linearGradient>
  </defs>

  <g filter="url(#shadow)">
    <!-- Vine Stem -->
    <path d="M 60 18 C 60 10, 68 8, 72 4 C 68 14, 62 20, 60 25 Z" fill="url(#vineGrad)"/>
    <!-- Grape Vine Leaf -->
    <path d="M 60 22 C 40 10, 20 28, 38 42 C 48 38, 55 32, 60 22 Z" fill="url(#leafGrad)"/>

    <!-- Cluster of Individual 3D Grape Spheres -->
    <!-- Back Layer -->
    <circle cx="45" cy="50" r="14" fill="url(#grapeGrad)"/>
    <circle cx="75" cy="50" r="14" fill="url(#grapeGrad)"/>
    <circle cx="38" cy="68" r="13" fill="url(#grapeGrad)"/>
    <circle cx="82" cy="68" r="13" fill="url(#grapeGrad)"/>

    <!-- Middle Layer -->
    <circle cx="60" cy="46" r="15" fill="url(#grapeGrad)"/>
    <circle cx="52" cy="65" r="15" fill="url(#grapeGrad)"/>
    <circle cx="68" cy="65" r="15" fill="url(#grapeGrad)"/>
    <circle cx="48" cy="82" r="13" fill="url(#grapeGrad)"/>
    <circle cx="72" cy="82" r="13" fill="url(#grapeGrad)"/>

    <!-- Front Bottom Layer -->
    <circle cx="60" cy="80" r="14" fill="url(#grapeGrad)"/>
    <circle cx="60" cy="95" r="12" fill="url(#grapeGrad)"/>

    <!-- Individual Glossy Highlights on Front Grapes -->
    <ellipse cx="56" cy="41" rx="4" ry="2" fill="#fff" opacity="0.6"/>
    <ellipse cx="48" cy="60" rx="4" ry="2" fill="#fff" opacity="0.6"/>
    <ellipse cx="64" cy="60" rx="4" ry="2" fill="#fff" opacity="0.6"/>
    <ellipse cx="56" cy="75" rx="4" ry="2" fill="#fff" opacity="0.6"/>
    <ellipse cx="56" cy="91" rx="3" ry="1.5" fill="#fff" opacity="0.6"/>
  </g>
</svg>