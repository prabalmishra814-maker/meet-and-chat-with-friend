<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="coin-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.5"/>
    </filter>

    <linearGradient id="coin-edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <radialGradient id="coin-face" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="85%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </radialGradient>

    <linearGradient id="coin-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g filter="url(#coin-glow)">
    <!-- Outer Rim -->
    <circle cx="100" cy="100" r="85" fill="url(#coin-edge)"/>
    <!-- Inner Rim Shadow -->
    <circle cx="100" cy="100" r="75" fill="#78350f"/>
    <!-- Face -->
    <circle cx="100" cy="100" r="72" fill="url(#coin-face)"/>
    <!-- Inner Ridge Circle -->
    <circle cx="100" cy="100" r="58" fill="none" stroke="#fef08a" stroke-width="3" opacity="0.8"/>
    <circle cx="100" cy="100" r="56" fill="none" stroke="#78350f" stroke-width="2" opacity="0.6"/>

    <!-- Center Star Emblem -->
    <path d="M 100 55 L 112 80 L 138 84 L 118 102 L 124 128 L 100 114 L 76 128 L 82 102 L 62 84 L 88 80 Z"
          fill="url(#coin-edge)" stroke="#78350f" stroke-width="2"/>
    <path d="M 100 55 L 112 80 L 100 114 L 88 80 Z" fill="#fef08a" opacity="0.6"/>

    <!-- Gloss Highlight Crescent -->
    <path d="M 30 90 A 72 72 0 0 1 170 90 A 70 70 0 0 0 30 90 Z" fill="url(#coin-shine)"/>
    <path d="M 152 48 L 155 58 L 165 61 L 155 64 L 152 74 L 149 64 L 139 61 L 149 58 Z" fill="#ffffff"/>
  </g>
</svg>