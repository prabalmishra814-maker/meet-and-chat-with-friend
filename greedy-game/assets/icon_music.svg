<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" width="100%" height="100%">
  <defs>
    <radialGradient id="btnMusicGold" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff5a5"/>
      <stop offset="60%" stop-color="#f5b000"/>
      <stop offset="100%" stop-color="#a86e00"/>
    </radialGradient>
    <filter id="musicDrop">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <circle cx="25" cy="25" r="22" fill="url(#btnMusicGold)" stroke="#fff" stroke-width="2" filter="url(#musicDrop)"/>

  <!-- Musical Note Icon -->
  <g fill="#3a1c00">
    <ellipse cx="18" cy="32" rx="4.5" ry="3.5" transform="rotate(-20 18 32)"/>
    <ellipse cx="32" cy="28" rx="4.5" ry="3.5" transform="rotate(-20 32 28)"/>
    <rect x="21" y="14" width="3" height="18" rx="1"/>
    <rect x="35" y="10" width="3" height="18" rx="1"/>
    <polygon points="21,14 38,10 38,15 21,19"/>
  </g>
</svg>