<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120">
  <defs>
    <radialGradient id="pawn_yellow_head" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFFF8D"/>
      <stop offset="35%" stop-color="#FFEA00"/>
      <stop offset="80%" stop-color="#FFD600"/>
      <stop offset="100%" stop-color="#E65100"/>
    </radialGradient>
    <linearGradient id="pawn_yellow_body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEE58"/>
      <stop offset="50%" stop-color="#FBC02D"/>
      <stop offset="100%" stop-color="#F57F17"/>
    </linearGradient>
    <linearGradient id="silver_metallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#CFD8DC"/>
      <stop offset="100%" stop-color="#78909C"/>
    </linearGradient>
    <filter id="pawn_shadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Drop Shadow Base -->
  <ellipse cx="50" cy="110" rx="38" ry="8" fill="#000" opacity="0.4" filter="url(#pawn_shadow)"/>

  <!-- Pedestal Base -->
  <ellipse cx="50" cy="102" rx="36" ry="10" fill="url(#silver_metallic)"/>
  <ellipse cx="50" cy="100" rx="32" ry="8" fill="url(#pawn_yellow_body)"/>

  <!-- Lower Body Cone -->
  <path d="M 22 98 C 24 78, 38 60, 42 48 L 58 48 C 62 60, 76 78, 78 98 Z" fill="url(#pawn_yellow_body)"/>
  <!-- Body Highlight Reflection -->
  <path d="M 30 96 C 32 80, 42 66, 45 50 C 42 50, 36 70, 32 94 Z" fill="#FFF" opacity="0.4"/>

  <!-- Neck Collar Ring -->
  <ellipse cx="50" cy="48" rx="16" ry="5" fill="url(#silver_metallic)"/>

  <!-- Head Sphere -->
  <circle cx="50" cy="28" r="22" fill="url(#pawn_yellow_head)"/>
  <!-- Head Glossy Highlight -->
  <ellipse cx="42" cy="20" rx="8" ry="5" fill="#FFF" opacity="0.75" transform="rotate(-25 42 20)"/>

  <!-- Crown Top Jewel -->
  <circle cx="50" cy="6" r="4" fill="url(#silver_metallic)"/>
</svg>