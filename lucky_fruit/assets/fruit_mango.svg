<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <radialGradient id="mangoGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fff066"/>
      <stop offset="30%" stop-color="#ff9900"/>
      <stop offset="70%" stop-color="#e62e00"/>
      <stop offset="90%" stop-color="#990000"/>
      <stop offset="100%" stop-color="#4d0000"/>
    </radialGradient>

    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80e633"/>
      <stop offset="50%" stop-color="#399909"/>
      <stop offset="100%" stop-color="#184d00"/>
    </linearGradient>
  </defs>

  <g filter="url(#shadow)">
    <!-- Leaf -->
    <path d="M 52 20 C 35 10, 15 20, 25 35 C 38 32, 48 28, 52 20 Z" fill="url(#leafGrad)"/>
    <path d="M 52 20 C 38 22, 28 26, 25 35" stroke="#a6ff4d" stroke-width="1" fill="none"/>

    <!-- Stem -->
    <path d="M 54 22 C 52 16, 56 12, 60 8 C 62 10, 58 16, 55 22 Z" fill="#4d2600"/>

    <!-- Mango Kidney Shape Body -->
    <path d="M 54 22 C 80 18, 102 38, 100 65 C 98 90, 72 104, 52 102 C 32 100, 20 82, 22 58 C 24 38, 38 24, 54 22 Z" fill="url(#mangoGrad)"/>

    <!-- Primary Specular Gloss Highlight -->
    <path d="M 40 32 C 55 26, 75 30, 80 40 C 65 38, 48 42, 40 32 Z" fill="url(#glossGrad)"/>
    <ellipse cx="48" cy="38" rx="12" ry="5" transform="rotate(-20 48 38)" fill="#ffffff" opacity="0.5"/>
  </g>
</svg>