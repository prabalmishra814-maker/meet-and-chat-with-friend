<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="bowlGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </radialGradient>
    <filter id="salDrop">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Shadow -->
  <ellipse cx="50" cy="85" rx="32" ry="6" fill="#000" opacity="0.25"/>
  <g filter="url(#salDrop)">
    <!-- White Bowl -->
    <ellipse cx="50" cy="62" rx="36" ry="18" fill="url(#bowlGrad)" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M 14 62 C 18 82 82 82 86 62 Z" fill="url(#bowlGrad)" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Salad Content -->
    <circle cx="38" cy="52" r="14" fill="#52b788"/>
    <circle cx="58" cy="50" r="15" fill="#74c69d"/>
    <circle cx="48" cy="42" r="12" fill="#2d6a4f"/>
    <!-- Cherry Tomatoes -->
    <circle cx="35" cy="46" r="5" fill="#ff1a1a"/>
    <circle cx="62" cy="48" r="5" fill="#ff1a1a"/>
    <circle cx="48" cy="56" r="4" fill="#ff1a1a"/>
    <!-- Cucumber Slices -->
    <circle cx="52" cy="48" r="6" fill="#b7efc5" stroke="#2d6a4f" stroke-width="1.5"/>
  </g>
</svg>