<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="wm-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#22c55e" flood-opacity="0.4"/>
    </filter>

    <linearGradient id="rind-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="25%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#166534"/>
      <stop offset="75%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>

    <radialGradient id="flesh-grad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="30%" stop-color="#f43f5e"/>
      <stop offset="80%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#881337"/>
    </radialGradient>
  </defs>

  <g filter="url(#wm-shadow)">
    <!-- Watermelon Slice Arc Frame -->
    <path d="M 20 80 C 20 165, 180 165, 180 80 Z" fill="url(#rind-grad)"/>
    <path d="M 28 80 C 28 155, 172 155, 172 80 Z" fill="#bbf7d0"/>
    <path d="M 35 80 C 35 145, 165 145, 165 80 Z" fill="url(#flesh-grad)"/>

    <!-- Dark Seeds -->
    <ellipse cx="65" cy="100" rx="5" ry="8" fill="#18181b" transform="rotate(-20 65 100)"/>
    <ellipse cx="100" cy="115" rx="5" ry="8" fill="#18181b"/>
    <ellipse cx="135" cy="100" rx="5" ry="8" fill="#18181b" transform="rotate(20 135 100)"/>
    <ellipse cx="80" cy="120" rx="4" ry="7" fill="#18181b" transform="rotate(-10 80 120)"/>
    <ellipse cx="120" cy="120" rx="4" ry="7" fill="#18181b" transform="rotate(10 120 120)"/>

    <!-- Seed Highlights -->
    <circle cx="64" cy="98" r="1.5" fill="#ffffff"/>
    <circle cx="99" cy="113" r="1.5" fill="#ffffff"/>
    <circle cx="134" cy="98" r="1.5" fill="#ffffff"/>

    <!-- Top Cut Edge Gloss -->
    <line x1="35" y1="80" x2="165" y2="80" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>