<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="hamGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff85a1"/>
      <stop offset="40%" stop-color="#f72585"/>
      <stop offset="80%" stop-color="#7209b7"/>
      <stop offset="100%" stop-color="#3a0ca3"/>
    </radialGradient>
    <linearGradient id="boneGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d0d0d0"/>
    </linearGradient>
    <filter id="hamDrop">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Shadow -->
  <ellipse cx="50" cy="85" rx="32" ry="8" fill="#000" opacity="0.25"/>
  <g transform="rotate(-20 50 50)" filter="url(#hamDrop)">
    <!-- White Bone protruding -->
    <path d="M 22 62 L 10 74 C 5 78 5 85 10 88 C 15 90 22 88 25 82 L 32 68 Z" fill="url(#boneGrad)" stroke="#b0b0b0" stroke-width="1.5"/>
    <circle cx="10" cy="80" r="5" fill="url(#boneGrad)"/>
    <circle cx="18" cy="86" r="5" fill="url(#boneGrad)"/>
    <!-- Juicy Ham / Meat Bulb -->
    <ellipse cx="56" cy="45" rx="28" ry="24" fill="url(#hamGrad)"/>
    <circle cx="70" cy="42" r="12" fill="#ffb703" opacity="0.3"/>
    <!-- Crosshatch grill lines -->
    <path d="M 42 30 L 68 58 M 52 26 L 76 52 M 38 42 L 58 64" stroke="#ff4d6d" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="48" cy="32" rx="8" ry="4" transform="rotate(-30 48 32)" fill="#ffffff" opacity="0.5"/>
  </g>
</svg>